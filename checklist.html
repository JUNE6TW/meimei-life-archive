<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEIMEI Daily Care Checklist</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;500&display=swap');
    :root{--bg:#efebe3;--paper:#fbf8f2;--card:#fffdf8;--text:#40382f;--accent:#687058;--line:rgba(64,56,47,.22);--done:#d8ddcc;--shadow:0 18px 50px rgba(64,56,47,.08)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,var(--paper),var(--bg));color:var(--text);font-family:'Noto Serif TC',serif;padding:22px 18px 92px}.grain{position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(rgba(64,56,47,.16) .5px,transparent .5px);background-size:5px 5px}.wrap{max-width:720px;margin:auto}.top{border:1px solid var(--line);border-radius:28px;padding:22px 20px;background:rgba(251,248,242,.72);box-shadow:var(--shadow);margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--accent);text-transform:uppercase}.title{font-family:'Cormorant Garamond',serif;font-size:54px;line-height:.9;margin:14px 0 12px;font-weight:300}.date{font-size:15px;letter-spacing:.08em;color:var(--accent)}.progress{margin-top:18px;height:10px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#f7f3ec}.bar{height:100%;width:0;background:var(--accent);transition:.25s}.summary{margin-top:10px;font-size:13px;color:var(--accent)}.section-title{font-family:'Cormorant Garamond',serif;font-size:32px;margin:24px 0 12px}.grid{display:grid;gap:12px}.item{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:22px;padding:16px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:.2s}.item.done{background:var(--done);opacity:.88}.box{width:28px;height:28px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--accent);margin-top:2px}.item.done .box{background:var(--accent);color:#fff}.time{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}.name{font-size:18px;font-weight:400}.note{font-size:13px;line-height:1.8;opacity:.82;margin-top:4px}.actions{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:999px;background:rgba(251,248,242,.8);padding:12px 16px;color:var(--text);font-family:inherit;letter-spacing:.08em}.bottom-nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(92vw,560px);height:58px;border:1px solid var(--line);border-radius:999px;background:rgba(251,248,242,.88);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(3,1fr);box-shadow:var(--shadow);overflow:hidden}.bottom-nav a{text-decoration:none;color:var(--text);font-size:12px;letter-spacing:.12em;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}.bottom-nav a:last-child{border-right:0}.tip{font-size:13px;line-height:1.8;border-left:1px solid var(--accent);padding-left:14px;margin:20px 0;color:var(--text)}
  </style>
</head>
<body>
  <div class="grain"></div>
  <main class="wrap">
    <section class="top">
      <div class="eyebrow">MEIMEI DAILY CARE</div>
      <h1 class="title">Checklist</h1>
      <div class="date" id="todayText"></div>
      <div class="progress"><div class="bar" id="progressBar"></div></div>
      <div class="summary" id="summaryText">0 / 0 completed</div>
    </section>

    <p class="tip">勾選紀錄會存在這台手機/瀏覽器裡。同一天重新打開不會消失；隔天會自動開新的日期。</p>

    <h2 class="section-title">早晨 / Morning</h2>
    <div class="grid">
      <label class="item" data-key="biofermin"><div class="box">✓</div><div><div class="time">After Breakfast</div><div class="name">表飛鳴</div><div class="note">早餐後，觀察食慾、精神、排便與腸胃狀況。</div></div></label>
      <label class="item" data-key="drop1-morning"><div class="box">✓</div><div><div class="time">Morning</div><div class="name">眼藥水 1</div><div class="note">兩眼各一滴。</div></div></label>
    </div>

    <h2 class="section-title">中午 / Noon</h2>
    <div class="grid">
      <label class="item" data-key="drop1-noon"><div class="box">✓</div><div><div class="time">Noon</div><div class="name">眼藥水 1</div><div class="note">兩眼各一滴。</div></div></label>
    </div>

    <h2 class="section-title">晚餐 / Dinner</h2>
    <div class="grid">
      <label class="item" data-key="drop1-night"><div class="box">✓</div><div><div class="time">Night</div><div class="name">眼藥水 1</div><div class="note">兩眼各一滴。</div></div></label>
      <label class="item" data-key="fish-oil"><div class="box">✓</div><div><div class="time">Every 2 Days</div><div class="name">魚油</div><div class="note">兩天一次，依家人安排補充。</div></div></label>
      <label class="item" data-key="antioxidant"><div class="box">✓</div><div><div class="time">Daily</div><div class="name">抗氧化</div><div class="note">一天一次。</div></div></label>
    </div>

    <h2 class="section-title">睡前 / Before Bed</h2>
    <div class="grid">
      <label class="item" data-key="drop2-bed"><div class="box">✓</div><div><div class="time">Before Bed</div><div class="name">眼藥水 2</div><div class="note">兩眼各一滴。每個眼藥間隔 5–10 分鐘。</div></div></label>
      <label class="item" data-key="drop3-left"><div class="box">✓</div><div><div class="time">Every 2 Days</div><div class="name">眼藥水 3</div><div class="note">兩天一次，晚上睡前，開刀左眼一滴。點左眼要非常輕柔。</div></div></label>
      <label class="item" data-key="brush"><div class="box">✓</div><div><div class="time">Before Bed</div><div class="name">刷牙</div><div class="note">睡前照護流程。</div></div></label>
      <label class="item" data-key="potty"><div class="box">✓</div><div><div class="time">Before Bed</div><div class="name">尿尿大便</div><div class="note">完成睡前儀式，準備上床睡覺。</div></div></label>
    </div>

    <div class="actions">
      <button class="btn" id="clearBtn">清除今天紀錄</button>
      <button class="btn" id="checkAllBtn">全部完成</button>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html#home">首頁</a>
    <a href="checklist.html">打卡</a>
    <a href="index.html#letter">信件</a>
  </nav>

  <script>
    const dateKey = new Date().toISOString().slice(0,10);
    const storageKey = 'meimei-checklist-' + dateKey;
    const formatter = new Intl.DateTimeFormat('zh-Hant-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
    document.getElementById('todayText').textContent = formatter.format(new Date());
    const items = [...document.querySelectorAll('.item')];
    let state = JSON.parse(localStorage.getItem(storageKey) || '{}');
    function save(){ localStorage.setItem(storageKey, JSON.stringify(state)); }
    function render(){
      let done = 0;
      items.forEach(item => { const key = item.dataset.key; const isDone = !!state[key]; item.classList.toggle('done', isDone); if(isDone) done++; });
      document.getElementById('summaryText').textContent = done + ' / ' + items.length + ' completed';
      document.getElementById('progressBar').style.width = (done / items.length * 100) + '%';
    }
    items.forEach(item => item.addEventListener('click', () => { const key = item.dataset.key; state[key] = !state[key]; save(); render(); }));
    document.getElementById('clearBtn').addEventListener('click', () => { state = {}; save(); render(); });
    document.getElementById('checkAllBtn').addEventListener('click', () => { state = {}; items.forEach(item => state[item.dataset.key] = true); save(); render(); });
    render();
  </script>
</body>
</html>
